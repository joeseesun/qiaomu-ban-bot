<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乔木 X 助手 · 商店素材</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#fafafa;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{width:1280px;height:800px;overflow:hidden}.canvas{position:relative;display:grid;grid-template-columns:440px 640px;gap:40px;width:1280px;height:800px;padding:64px 64px 60px;background:radial-gradient(ellipse at 80% 15%,#ededed 0,transparent 65%),#fafafa}.intro{display:flex;flex-direction:column;align-items:flex-start;min-width:0}.brand{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:600;letter-spacing:.02em}.brand img{width:42px;height:42px}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:2px;color:#777;margin-top:88px}h1{font-size:48px;line-height:1.25;letter-spacing:-2px;margin:20px 0 22px;font-weight:650}p{font-size:19px;line-height:1.8;margin:0;color:#666;max-width:415px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}.chips span{font-size:13px;padding:8px 11px;border:1px solid #ddd;border-radius:6px;background:#fff}.foot{margin-top:auto;font-size:12px;color:#777;line-height:1.8}.frame{width:640px;height:676px;border:1px solid #e5e5e5;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 16px 40px #00000009;align-self:start}.frame img{display:block;width:640px;height:auto}.stamp{position:absolute;right:64px;bottom:24px;font-size:11px;color:#888}.promo{display:none}body.tile{width:440px;height:280px;background:#171717;color:#fff}.tile .canvas{display:none}.tile .promo{display:flex;position:relative;width:440px;height:280px;padding:30px;flex-direction:column;align-items:flex-start;background:#171717}.promo .brand{font-size:14px;font-weight:500;color:#ccc}.promo .brand img{width:34px;height:34px;border:1px solid #444;border-radius:9px}.promo h1{font-size:34px;letter-spacing:-1px;margin:25px 0 10px}.promo p{font-size:14px;color:#aaa;line-height:1.6}.promo small{margin-top:auto;color:#aaa;font-size:12px}
</style>
<section class="canvas"><div class="intro"><div class="brand"><img src="../../dist/chrome/icons/icon-48.png" alt="">乔木 X 助手</div><div class="eyebrow"></div><h1></h1><p class="subtitle"></p><div class="chips"></div><div class="foot"></div></div><div class="frame"><img class="shot" alt="扩展真实界面，使用示例数据"></div><span class="stamp">Qiaomu X Helper · 0.2.0 · 界面示例 / 模拟数据</span></section>
<section class="promo"><div class="brand"><img src="../../dist/chrome/icons/icon-48.png" alt="">Qiaomu X Helper</div><h1>乔木 X 助手</h1><p>读得清楚，聊得顺手。</p><small>回复过滤 · 常用 @ · 书签导出</small></section>
<script>
const slides=[
['01 / READ','回复区，<br>清爽一点。','按你设置的 AI 概率折叠回复。<br>随时展开，也能亲手纠正。',['自定义阈值','AI / 真人标注'],'需要自备 Jev API Key。<br>模型可能误判，不证明作者身份。','replies.png'],
['02 / MENTION','想找的人，<br>随时 @。','记住常聊的账号。<br>用昵称、备注或拼音找到对方。',['昵称 + @账号','可编辑的反馈联系人'],'联系人保存在本机。<br>插入由你选择，发送由你决定。','contacts.png'],
['03 / KEEP','书签，<br>不止一个链接。','加上备注与标签。<br>需要时，导出为 Markdown。',['自动保存已加载书签','不需要 API Key'],'只保存浏览时已加载的内容。<br>你的备注、标签和原帖链接一起保留。','bookmarks.png'],
['04 / FIND','想看的，<br>找得更准。','关键词、账号、时间和互动，<br>组合成自己的常用搜索。',['7 个可编辑模板','保存 / 置顶 / JSON'],'在 X 原生搜索中打开。<br>近七天等条件每次执行时自动更新。','advanced-search.png'],
['05 / FOLLOW','值得关注，<br>先看内容。','内容、独立表达、互动质量，<br>分开看，再决定。',['样本范围可见','保留证据与来源'],'需自备 Jev API Key，主动点击分析。<br>有限样本参考，不证明账号身份。','kol.png']
];
const q=new URLSearchParams(location.search);if(q.has('tile'))document.body.className='tile';
const i=Math.max(0,Math.min(4,Number(q.get('slide')||1)-1)),s=slides[i];
document.querySelector('.eyebrow').textContent=s[0];document.querySelector('.intro h1').innerHTML=s[1];document.querySelector('.subtitle').innerHTML=s[2];for(const text of s[3]){const n=document.createElement('span');n.textContent=text;document.querySelector('.chips').append(n);}document.querySelector('.foot').innerHTML=s[4];document.querySelector('.shot').src='assets/'+s[5];
</script>
