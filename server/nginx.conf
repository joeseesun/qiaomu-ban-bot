limit_req_zone $binary_remote_addr zone=qx_community:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=qx_enroll:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=qx_connections:1m;
server {
    listen 80;
    server_name x-community.qiaomu.ai;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/qiaomu-apps/x-community/acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name x-community.qiaomu.ai;
    ssl_certificate /etc/letsencrypt/live/x-community.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x-community.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_conn qx_connections 16;
    limit_req zone=qx_community burst=30 nodelay;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /v1/enroll {
        limit_req zone=qx_enroll burst=5 nodelay;
        proxy_pass http://127.0.0.1:3258;
        proxy_read_timeout 15s;
    }
    location / {
        proxy_pass http://127.0.0.1:3258;
        proxy_read_timeout 15s;
    }
}
